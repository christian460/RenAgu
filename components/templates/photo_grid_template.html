<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:transparent;
    padding:15px;
}

.titulo{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:#1976d2;
    margin-bottom:20px;
}

.grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(250px,1fr)
        );

    gap:15px;
}

.card{

    overflow:hidden;

    border-radius:12px;

    cursor:pointer;

    box-shadow:
        0 2px 10px
        rgba(0,0,0,.12);

    transition:
        transform .25s ease;
}

.card:hover{

    transform:
        translateY(-3px);
}

.card img{

    width:100%;

    height:220px;

    object-fit:cover;

    display:block;

    transition:
        transform .35s ease;
}

.card:hover img{

    transform:
        scale(1.05);
}

/* LIGHTBOX */

.lightbox{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.85);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:9999;
}

.lightbox.active{
    display:flex;
}

.lightbox img{

    max-width:90vw;

    max-height:90vh;

    border-radius:10px;

    box-shadow:
        0 0 25px
        rgba(255,255,255,.2);
}

.close{

    position:absolute;

    top:20px;

    right:30px;

    color:white;

    font-size:40px;

    cursor:pointer;

    font-weight:bold;
}

.close:hover{
    opacity:.7;
}

</style>
</head>

<body>

<div class="titulo">
    {{TITULO}}
</div>

<div class="grid" id="grid"></div>

<div
    class="lightbox"
    id="lightbox"
>

    <span
        class="close"
        onclick="closeLightbox()"
    >
        &times;
    </span>

    <img id="lightbox-img">

</div>

<script>

const IMAGES = {{IMAGES}};

const grid =
    document.getElementById(
        "grid"
    );

IMAGES.forEach(img => {

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "card";

    card.innerHTML =
        `<img src="${img}">`;

    card.onclick =
        () => openLightbox(img);

    grid.appendChild(card);
});

function openLightbox(src){

    document
        .getElementById(
            "lightbox-img"
        )
        .src = src;

    document
        .getElementById(
            "lightbox"
        )
        .classList
        .add("active");
}

function closeLightbox(){

    document
        .getElementById(
            "lightbox"
        )
        .classList
        .remove("active");
}

document
    .getElementById(
        "lightbox"
    )
    .addEventListener(
        "click",
        function(e){

            if(
                e.target.id ===
                "lightbox"
            ){
                closeLightbox();
            }
        }
    );

</script>

</body>
</html>
